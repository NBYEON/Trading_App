spring.application.name=papertrade-api
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/papertrade}
spring.datasource.username=${DB_USER:papertrade}
spring.datasource.password=${DB_PASSWORD:papertrade}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
