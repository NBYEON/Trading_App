services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: papertrade
      POSTGRES_USER: papertrade
      POSTGRES_PASSWORD: papertrade
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - papertrade_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrade -d papertrade"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  papertrade_db:
